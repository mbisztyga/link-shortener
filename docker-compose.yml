version: '2.1'

networks:
  app-tier:
    driver: bridge

services:
  cassandra:
    image: 'bitnami/cassandra:latest'
    networks:
      - app-tier
    environment:
      CASSANDRA_USER: "cassandra"
      CASSANDRA_PASSWORD: "cassandra"
    healthcheck:
      test: ["CMD-SHELL", "[ $$(nodetool statusgossip) = running ]"]
      interval: 30s
      timeout: 10s
      retries: 5
    ports:
      - "9042:9042"
  load:
    build:
      context: ./load
    image: "load:latest"
    networks:
      - app-tier
    ports:
      - "8082:8082"
    depends_on:
      cassandra:
        condition: service_healthy
  save:
    build:
      context: ./save
    image: "save:latest"
    networks:
      - app-tier
    ports:
      - "8081:8081"
    depends_on:
      cassandra:
        condition: service_healthy
  remove:
    build:
      context: ./remove
    image: "remove:latest"
    networks:
      - app-tier
    ports:
      - "8083:8083"
    depends_on:
      cassandra:
        condition: service_healthy
  zookeeper:
    image: 'bitnami/zookeeper:latest'
    networks:
      - app-tier
    environment:
      ALLOW_ANONYMOUS_LOGIN: "yes"
    ports:
      - "2181:2181"

  kafka:
    image: wurstmeister/kafka:latest
    networks:
      - app-tier
    ports:
      - "9092:9092"
    environment:
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CREATE_TOPICS: "badword_topic:1:1"
    depends_on:
      - zookeeper
